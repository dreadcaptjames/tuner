<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Tuner — Guitar · Banjo · Mandolin</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #e9ebee; --dim: #8b929c;
    --good: #3ecf8e; --warn: #f2b84b; --bad: #ef6461; --accent: #6aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 16px; letter-spacing: .02em; color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: 1; }
  .seg button { flex: 1; background: none; border: 0; color: var(--dim); padding: 9px 6px; border-radius: 7px;
    font: inherit; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--text); }
  select, .a4 input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font: inherit; }
  select { flex: 1; min-width: 0; }
  .a4 { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: .9rem; }
  .a4 input { width: 76px; padding: 10px 8px; }

  .meter { position: relative; margin: 22px 0 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 16px 18px; text-align: center; overflow: hidden; }
  .note { font-size: 5.5rem; font-weight: 700; line-height: 1; letter-spacing: -.02em; transition: color .15s; }
  .note sub { font-size: 1.6rem; font-weight: 500; color: var(--dim); vertical-align: baseline; margin-left: 2px; }
  .readout { color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 6px; min-height: 1.4em; }
  .scale { position: relative; height: 54px; margin-top: 18px; }
  .ticks { position: absolute; inset: 0; }
  .tick { position: absolute; bottom: 12px; width: 2px; background: var(--line); transform: translateX(-1px); }
  .tick.major { background: #444a55; }
  .tick.zero { background: var(--good); width: 3px; }
  .zone { position: absolute; bottom: 12px; height: 34px; left: calc(50% - 5%); width: 10%;
    background: rgba(62, 207, 142, .12); border-radius: 4px; }
  .needle { position: absolute; bottom: 8px; left: 50%; width: 4px; height: 44px; margin-left: -2px; border-radius: 2px;
    background: var(--dim); transition: left .08s linear, background .15s; }
  .labels { position: absolute; bottom: -6px; left: 0; right: 0; font-size: .75rem; color: var(--dim); }
  .labels span { position: absolute; transform: translateX(-50%); }
  .hint { margin-top: 24px; font-weight: 600; min-height: 1.4em; }
  .in-tune .note, .in-tune .hint { color: var(--good); }
  .in-tune .needle { background: var(--good); }
  .near .needle { background: var(--warn); }
  .near .hint { color: var(--warn); }
  .far .needle { background: var(--bad); }
  .far .hint { color: var(--bad); }

  .strings { display: grid; gap: 8px; margin-top: 14px; }
  .string { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
    padding: 10px 4px 8px; font: inherit; cursor: pointer; text-align: center; transition: border-color .15s, background .15s; }
  .string b { display: block; font-size: 1.25rem; }
  .string small { color: var(--dim); font-size: .68rem; white-space: nowrap; }
  .string.active { border-color: var(--accent); }
  .string.done { border-color: var(--good); background: rgba(62, 207, 142, .08); }
  .string.locked { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  .string.locked small { color: #0b1220; }
  .opts { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--dim); font-size: .9rem; gap: 10px; flex-wrap: wrap; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }

  .start { width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
    font-size: 1.05rem; background: var(--accent); color: #0b1220; cursor: pointer; }
  .start.on { background: var(--line); color: var(--text); }
  .msg { color: var(--bad); margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
  footer { color: var(--dim); font-size: .8rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>TUNER</h1>

  <div class="row">
    <div class="seg" id="instruments" role="group" aria-label="Instrument">
      <button data-inst="guitar" aria-pressed="true">Guitar</button>
      <button data-inst="banjo" aria-pressed="false">Banjo</button>
      <button data-inst="mandolin" aria-pressed="false">Mandolin</button>
    </div>
  </div>
  <div class="row" style="margin-top:8px">
    <select id="tuning" aria-label="Tuning"></select>
    <label class="a4">A4 <input id="a4" type="number" min="415" max="466" step="1" value="440"> Hz</label>
  </div>

  <section class="meter" id="meter" aria-live="polite">
    <div class="note" id="note">–</div>
    <div class="readout" id="readout">Tap Start and play a string</div>
    <div class="scale">
      <div class="zone"></div>
      <div class="ticks" id="ticks"></div>
      <div class="needle" id="needle"></div>
      <div class="labels"><span style="left:0%">-50</span><span style="left:25%">-25</span><span style="left:50%">0</span><span style="left:75%">+25</span><span style="left:100%">+50</span></div>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <div class="strings" id="strings"></div>
  <div class="opts">
    <span id="modeText">Auto: detects the nearest string. Tap a string to lock it or hear it.</span>
    <label><input type="checkbox" id="tone"> Play reference tone on tap</label>
  </div>

  <button class="start" id="start">Start tuning</button>
  <div class="msg" id="msg"></div>
  <footer>Runs entirely in your browser. Microphone audio never leaves your device.</footer>
</main>

<script src="pitch.js"></script>
<script>
(function () {
  "use strict";
  const P = window.Pitch;

  // Strings are listed low (thickest / furthest from you) to high, except banjo
  // where the short 5th string comes first as it sits on top of the neck.
  const TUNINGS = {
    guitar: [
      { name: "Standard (E A D G B E)", notes: ["E2", "A2", "D3", "G3", "B3", "E4"] },
      { name: "Drop D (D A D G B E)", notes: ["D2", "A2", "D3", "G3", "B3", "E4"] },
      { name: "Half step down (Eb)", notes: ["Eb2", "Ab2", "Db3", "Gb3", "Bb3", "Eb4"] },
      { name: "Whole step down (D)", notes: ["D2", "G2", "C3", "F3", "A3", "D4"] },
      { name: "DADGAD", notes: ["D2", "A2", "D3", "G3", "A3", "D4"] },
      { name: "Open G (D G D G B D)", notes: ["D2", "G2", "D3", "G3", "B3", "D4"] },
      { name: "Open D (D A D F# A D)", notes: ["D2", "A2", "D3", "F#3", "A3", "D4"] },
      { name: "Open E (E B E G# B E)", notes: ["E2", "B2", "E3", "G#3", "B3", "E4"] },
      { name: "Drop C (C G C F A D)", notes: ["C2", "G2", "C3", "F3", "A3", "D4"] },
    ],
    banjo: [
      { name: "Open G (g D G B D)", notes: ["G4", "D3", "G3", "B3", "D4"] },
      { name: "Double C (g C G C D)", notes: ["G4", "C3", "G3", "C4", "D4"] },
      { name: "Standard C (g C G B D)", notes: ["G4", "C3", "G3", "B3", "D4"] },
      { name: "Open D (f# D F# A D)", notes: ["F#4", "D3", "F#3", "A3", "D4"] },
      { name: "Sawmill / G modal (g D G C D)", notes: ["G4", "D3", "G3", "C4", "D4"] },
      { name: "Open A (a E A C# E)", notes: ["A4", "E3", "A3", "C#4", "E4"] },
      { name: "Tenor — standard (C G D A)", notes: ["C3", "G3", "D4", "A4"] },
      { name: "Tenor — Irish (G D A E)", notes: ["G2", "D3", "A3", "E4"] },
    ],
    mandolin: [
      { name: "Standard (G D A E)", notes: ["G3", "D4", "A4", "E5"] },
      { name: "Cross A (A E A E)", notes: ["A3", "E4", "A4", "E5"] },
      { name: "Open G (G D G B)", notes: ["G3", "D4", "G4", "B4"] },
      { name: "Mandola (C G D A)", notes: ["C3", "G3", "D4", "A4"] },
      { name: "Octave mandolin (G D A E)", notes: ["G2", "D3", "A3", "E4"] },
    ],
  };

  const IN_TUNE = 5;   // cents
  const NEAR = 15;     // cents

  const $ = (id) => document.getElementById(id);
  const els = {
    instruments: $("instruments"), tuning: $("tuning"), a4: $("a4"), meter: $("meter"), note: $("note"),
    readout: $("readout"), needle: $("needle"), hint: $("hint"), strings: $("strings"), start: $("start"),
    msg: $("msg"), tone: $("tone"), ticks: $("ticks"), modeText: $("modeText"),
  };

  const saved = JSON.parse(localStorage.getItem("tuner") || "{}");
  const state = {
    inst: TUNINGS[saved.inst] ? saved.inst : "guitar",
    tuningIdx: saved.tuningIdx || 0,
    a4: saved.a4 || 440,
    tone: !!saved.tone,
    locked: -1,
    done: new Set(),
  };
  const save = () => localStorage.setItem("tuner", JSON.stringify({ inst: state.inst, tuningIdx: state.tuningIdx, a4: state.a4, tone: state.tone }));

  // Ticks on the cents scale
  for (let c = -50; c <= 50; c += 5) {
    const t = document.createElement("div");
    t.className = "tick" + (c === 0 ? " zero" : c % 25 === 0 ? " major" : "");
    t.style.left = (c + 50) + "%";
    t.style.height = (c === 0 ? 40 : c % 25 === 0 ? 26 : 14) + "px";
    els.ticks.appendChild(t);
  }

  function currentStrings() {
    const t = TUNINGS[state.inst][state.tuningIdx] || TUNINGS[state.inst][0];
    return t.notes.map((n) => {
      const midi = P.noteToMidi(n);
      return { label: n.replace(/-?\d$/, ""), octave: n.match(/-?\d$/)[0], midi, freq: P.midiToFreq(midi, state.a4) };
    });
  }

  function renderInstrument() {
    for (const b of els.instruments.querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.inst === state.inst);
    els.tuning.innerHTML = "";
    TUNINGS[state.inst].forEach((t, i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = t.name;
      els.tuning.appendChild(o);
    });
    if (state.tuningIdx >= TUNINGS[state.inst].length) state.tuningIdx = 0;
    els.tuning.value = state.tuningIdx;
    renderStrings();
  }

  function renderStrings() {
    const strs = currentStrings();
    state.locked = -1;
    state.done.clear();
    els.strings.style.gridTemplateColumns = `repeat(${strs.length}, 1fr)`;
    els.strings.innerHTML = "";
    recent.length = 0;
    strs.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "string";
      b.innerHTML = `<b>${s.label}<sub style="font-size:.6em;opacity:.6">${s.octave}</sub></b><small>${s.freq.toFixed(1)} Hz</small>`;
      b.title = "Tap to lock this string" + (state.tone ? " and play its tone" : "");
      b.addEventListener("click", () => onStringTap(i));
      els.strings.appendChild(b);
    });
    updateModeText();
  }

  function updateModeText() {
    els.modeText.textContent = state.locked >= 0
      ? "Locked to one string. Tap it again for auto mode."
      : "Auto: detects the nearest string. Tap a string to lock it.";
  }

  function onStringTap(i) {
    state.locked = state.locked === i ? -1 : i;
    [...els.strings.children].forEach((b, j) => b.classList.toggle("locked", j === state.locked));
    updateModeText();
    if (state.tone) playTone(currentStrings()[i].freq);
  }

  // Reference tone: a soft plucked-ish tone
  let toneCtx = null;
  function playTone(freq) {
    toneCtx = toneCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (toneCtx.state === "suspended") toneCtx.resume();
    const now = toneCtx.currentTime;
    const out = toneCtx.createGain();
    out.gain.setValueAtTime(0.0001, now);
    out.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
    out.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
    out.connect(toneCtx.destination);
    [[1, 1], [2, 0.35], [3, 0.15]].forEach(([h, g]) => {
      const o = toneCtx.createOscillator();
      const og = toneCtx.createGain();
      o.type = "sine"; o.frequency.value = freq * h; og.gain.value = g;
      o.connect(og).connect(out);
      o.start(now); o.stop(now + 2.3);
    });
  }

  // ---- Microphone + analysis loop ----
  let audio = null; // { ctx, stream, analyser, buf }
  let raf = 0;
  const recent = [];   // recent frequency readings for median smoothing
  let lastHeard = 0;
  let shownCents = 0;

  async function start() {
    els.msg.textContent = "";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      els.msg.textContent = "This browser can't access the microphone. Open the page over https:// or localhost.";
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      const src = ctx.createMediaStreamSource(stream);
      const hp = ctx.createBiquadFilter(); // cut rumble below the lowest string
      hp.type = "highpass"; hp.frequency.value = 50;
      const analyser = ctx.createAnalyser();
      analyser.fftSize = ctx.sampleRate > 50000 ? 8192 : 4096;
      src.connect(hp).connect(analyser);
      audio = { ctx, stream, analyser, buf: new Float32Array(analyser.fftSize) };
      els.start.textContent = "Stop";
      els.start.classList.add("on");
      els.readout.textContent = "Listening… play a string";
      loop();
    } catch (e) {
      els.msg.textContent = e && e.name === "NotAllowedError"
        ? "Microphone permission was denied. Allow it in your browser settings and try again."
        : "Couldn't start the microphone: " + (e && e.message ? e.message : e);
    }
  }

  function stop() {
    cancelAnimationFrame(raf);
    if (audio) {
      audio.stream.getTracks().forEach((t) => t.stop());
      audio.ctx.close();
      audio = null;
    }
    els.start.textContent = "Start tuning";
    els.start.classList.remove("on");
    resetDisplay("Tap Start and play a string");
  }

  function resetDisplay(text) {
    els.note.innerHTML = "–";
    els.readout.textContent = text;
    els.hint.textContent = "";
    els.meter.className = "meter";
    els.needle.style.left = "50%";
    [...els.strings.children].forEach((b) => b.classList.remove("active"));
  }

  function median(arr) {
    const s = [...arr].sort((a, b) => a - b);
    return s[s.length >> 1];
  }

  function loop() {
    raf = requestAnimationFrame(loop);
    if (!audio) return;
    audio.analyser.getFloatTimeDomainData(audio.buf);
    const strs = currentStrings();
    const lo = Math.min(...strs.map((s) => s.freq)), hi = Math.max(...strs.map((s) => s.freq));
    const r = P.detectPitch(audio.buf, audio.ctx.sampleRate, {
      minFreq: Math.max(40, lo * 0.6), maxFreq: Math.min(2000, hi * 1.6), minRms: 0.008,
    });
    const now = performance.now();

    if (r && r.clarity > 0.85) {
      // Drop readings that jump far from the current run (e.g. pick attack, octave slips)
      if (recent.length && Math.abs(P.centsBetween(r.freq, median(recent))) > 80) recent.length = 0;
      recent.push(r.freq);
      if (recent.length > 7) recent.shift();
      lastHeard = now;
      if (recent.length >= 2) show(median(recent), strs);
    } else if (now - lastHeard > 1200 && lastHeard) {
      recent.length = 0;
      lastHeard = 0;
      resetDisplay("Listening… play a string");
    }
  }

  function show(freq, strs) {
    // Which string are we tuning?
    let idx = state.locked;
    if (idx < 0) {
      let best = Infinity;
      strs.forEach((s, i) => {
        const c = Math.abs(P.centsBetween(freq, s.freq));
        if (c < best) { best = c; idx = i; }
      });
    }
    const target = strs[idx];
    const cents = P.centsBetween(freq, target.freq);

    // Smooth needle movement
    shownCents += (cents - shownCents) * 0.35;
    const clamped = Math.max(-50, Math.min(50, shownCents));
    els.needle.style.left = (clamped + 50) + "%";

    els.note.innerHTML = `${target.label}<sub>${target.octave}</sub>`;
    const heard = P.midiToName(P.freqToMidi(freq, state.a4));
    els.readout.textContent = `${freq.toFixed(1)} Hz · target ${target.freq.toFixed(1)} Hz · ${cents >= 0 ? "+" : ""}${cents.toFixed(0)}¢` +
      (Math.abs(cents) > 50 ? ` (hearing ${heard})` : "");

    const a = Math.abs(cents);
    els.meter.className = "meter " + (a <= IN_TUNE ? "in-tune" : a <= NEAR ? "near" : "far");
    els.hint.textContent = a <= IN_TUNE ? "In tune ✓" : cents < 0 ? "Too low — tighten ↑" : "Too high — loosen ↓";

    [...els.strings.children].forEach((b, j) => b.classList.toggle("active", j === idx));
    if (a <= IN_TUNE) {
      state.done.add(idx);
      els.strings.children[idx].classList.add("done");
    }
  }

  // ---- Wiring ----
  els.instruments.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.dataset.inst === state.inst) return;
    state.inst = b.dataset.inst; state.tuningIdx = 0; save(); renderInstrument();
  });
  els.tuning.addEventListener("change", () => { state.tuningIdx = +els.tuning.value; save(); renderStrings(); });
  els.a4.addEventListener("change", () => {
    const v = Math.round(+els.a4.value);
    state.a4 = v >= 415 && v <= 466 ? v : 440;
    els.a4.value = state.a4; save(); renderStrings();
  });
  els.tone.addEventListener("change", () => { state.tone = els.tone.checked; save(); renderStrings(); });
  els.start.addEventListener("click", () => (audio ? stop() : start()));

  els.a4.value = state.a4;
  els.tone.checked = state.tone;
  renderInstrument();
})();
</script>
</body>
</html>
