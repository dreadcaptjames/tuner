name: Build installable tuner icons

on:
  push:
    branches: [main]
    paths:
      - 'icons/icon.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render PNGs from master SVG
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path

          svg = Path('icons/icon.svg').read_bytes()
          for filename, size in (
              ('icons/icon-192.png', 192),
              ('icons/icon-512.png', 512),
              ('icons/apple-touch-icon.png', 180),
          ):
              cairosvg.svg2png(bytestring=svg, write_to=filename,
                              output_width=size, output_height=size)
              print(f'Created {filename} ({size}x{size})')
          PY
      - name: Commit updated home-screen icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Update raster app icons from refreshed SVG [skip ci]"
            git push
          fi
